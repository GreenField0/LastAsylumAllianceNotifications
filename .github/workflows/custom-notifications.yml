name: Custom Notifications

on:
  schedule:
    # Polls every 15 minutes for due custom notifications (Google Sheet)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual triggering for testing purposes

permissions:
  contents: write

jobs:
  send-custom-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute PowerShell Script
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL_CUSTOM: ${{ secrets.DISCORD_WEBHOOK_URL_CUSTOM }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          DISCORD_ROLE_ID_GILDENLEITUNG: ${{ secrets.DISCORD_ROLE_ID_GILDENLEITUNG }}
          DISCORD_ROLE_ID_USER: ${{ secrets.DISCORD_ROLE_ID_USER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ./Send-CustomNotifications.ps1

      - name: Persist Known Message IDs
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .custom-notifications-known-ids.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update known Discord message IDs [skip ci]"
            git push
          } else {
            Write-Output "No changes to commit."
          }
