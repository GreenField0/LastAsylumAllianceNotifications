name: Daily Alliance Briefing

on:
  schedule:
    # Runs every 15 minutes to check all alliance timezones and target times
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual triggering for testing purposes

permissions:
  contents: write

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute PowerShell Script
        shell: pwsh
        env:
          ALLIANCES_CONFIG: ${{ secrets.ALLIANCES_CONFIG }}
        run: |
          ./Send-DailyBriefing.ps1

      - name: Persist Last Message ID and Date
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .daily-state-*.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update daily briefing states [skip ci]"
            git pull --rebase
            git push
          } else {
            Write-Output "No changes to commit."
          }