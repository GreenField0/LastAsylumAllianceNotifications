name: Daily Alliance Briefing

on:
  schedule:
    # Runs at 02:00 UTC every day (04:00 CEST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows manual triggering for testing purposes

permissions:
  contents: write

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute PowerShell Script
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL_DAILY: ${{ secrets.DISCORD_WEBHOOK_URL_DAILY }}
        run: |
          ./Send-DailyBriefing.ps1

      - name: Persist Last Message ID
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-message-id.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update last Discord message ID [skip ci]"
            git push
          } else {
            Write-Output "No changes to commit."
          }